name: ticketing_app
description: "AI-Powered Conversational Ticketing System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  http: ^1.2.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  lottie: ^3.1.2
  flutter_local_notifications: ^20.1.0
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  timezone: ^0.10.0
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env