version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Respond to help requests
  steps:
  - intent: ask_help
  - action: utter_help

- rule: Respond to thanks
  steps:
  - intent: thanks
  - action: utter_thanks

- rule: Respond to booking history
  steps:
  - intent: ask_booking_history
  - action: utter_booking_history

- rule: Respond to nearby places
  steps:
  - intent: ask_places
  - action: action_get_nearby_places

- rule: Respond to fun requests
  steps:
  - intent: ask_fun
  - action: action_get_nearby_places

- rule: Respond to relax requests
  steps:
  - intent: ask_relax
  - action: action_get_nearby_places

- rule: Respond to food requests
  steps:
  - intent: ask_food
  - action: action_get_nearby_places

- rule: Respond to explore requests
  steps:
  - intent: ask_explore
  - action: action_get_nearby_places

- rule: Respond to trip planning requests
  steps:
  - intent: plan_trip
  - action: action_plan_trip

- rule: Respond to shorten plan requests
  steps:
  - intent: shorten_plan
  - action: action_plan_trip

- rule: Respond to extend plan requests
  steps:
  - intent: extend_plan
  - action: action_plan_trip

- rule: Respond to preference change requests
  steps:
  - intent: modify_preference
  - action: action_plan_trip
