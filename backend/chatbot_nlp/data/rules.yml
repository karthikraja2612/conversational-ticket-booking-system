version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Respond to help requests
  steps:
  - intent: ask_help
  - action: utter_help

- rule: Respond to thanks
  steps:
  - intent: thanks
  - action: utter_thanks

- rule: Respond to booking history
  steps:
  - intent: ask_booking_history
  - action: utter_booking_history
